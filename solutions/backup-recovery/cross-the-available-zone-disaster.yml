            if [ "$code" = "200" ] || [ "$code" = "302" ]; then HTTP_OK=1; break; fi
            sleep 15
          done
          [ "$HTTP_OK" = "1" ] || { echo "FATAL: storefront not responding"; exit 1; }
          echo "=== Magento deployment finished: $BASE_URL ==="
        - DbHost:
            Fn::GetAtt:
            - Rds
            - InnerConnectionString
          DbName:
            Ref: RdsDBName
          DbUser:
            Ref: RdsAccountName
          DbPass:
            Ref: RdsAccountPwd
          AdminPass:
            Ref: EcsGroupPassword
          BaseUrl:
            Fn::Join:
            - ''
            - - http://
              - Fn::GetAtt:
                - Slb
                - IpAddress
              - /
          InstallLocalDb: 'false'
          CryptMode: 'shared'
