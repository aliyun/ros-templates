                          'initStatements' => 'SET NAMES utf8mb4;',
                          'active' => '1',
                          'driver_options' => [1014 => false]
                      ]
                  ]
              ],
              'resource' => ['default_setup' => ['connection' => 'default']],
              'x-frame-options' => 'SAMEORIGIN',
              'MAGE_MODE' => 'default',
              'session' => ['save' => 'files'],
              'lock' => ['provider' => 'db'],
              'directories' => ['document_root_is_pub' => true],
              'install' => ['date' => '$(date -u '+%a, %d %b %Y %H:%M:%S +0000')']
          ];
