          chown -R apache:apache /var/www/html/magento2
          systemctl restart php-fpm httpd

          HTTP_OK=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 http://127.0.0.1/)
            echo "storefront check $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then HTTP_OK=1; break; fi
            sleep 15
          done
          [ "$HTTP_OK" = "1" ] || { echo "FATAL: storefront not responding"; exit 1; }
          echo "=== Magento deployment finished: $BASE_URL ==="
