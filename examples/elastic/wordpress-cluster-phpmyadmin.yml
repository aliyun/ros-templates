ROSTemplateFormatVersion: '2015-09-01'
Description:
  zh-cn: 部署WordPress和phpMyAdmin应用，含VPC、ECS、RDS、SLB资源，实现自动安装配置与公网访问。
  en: Deploy WordPress and phpMyAdmin applications, including VPC, ECS, RDS, and SLB resources, to enable automatic installation, configuration, and public network access.
Parameters:
  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区ID
    Description:
      en: Ensure that the available regions support the creation of RDS, SLB, and ECS resource specifications;<br><a href='https://www.alibabacloud.com/help/doc-detail/123712.html' target='_blank'><b><font color='blue'>View region and zone information</font></b></a>.
      zh-cn: 确保可用区域支持RDS、SLB和ECS资源规格的创建；<br><a href='https://help.aliyun.com/document_detail/123712.html' target='_blank'><b><font color='blue'>查看可用区信息</font></b></a>.
    AssociationProperty: ALIYUN::ECS::Instance:ZoneId
  JumpboxInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    Description:
      en: "Please confirm the inventory of this specification under the available area; <br>See detail: <a href='https://www.alibabacloud.com/help/doc-detail/25378.html' target='_blank'><b><font color='blue'>Instance specification family</font></a></b>"
      zh-cn: 请在可用区域下确认此规格的库存；详见： <a href='https://help.aliyun.com/document_detail/25378.html' target='_blank'><b><font color='blue'>实例规格族</font></a></b>
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ZoneId
  JumpboxImageId:
    Type: String
    Label:
      en: Image ID
      zh-cn: 镜像ID
    Description:
      en: "Image ID,See detail: <b><a href='https://www.alibabacloud.com/help/doc-detail/112977.html' target='_blank'><font color='blue'>Find the mirror</font></a></b>"
      zh-cn: 镜像ID，详见： <b><a href='https://help.aliyun.com/document_detail/112977.html' target='_blank'><font color='blue'>查找镜像</font></a></b>
    AssociationProperty: ALIYUN::ECS::Image::ImageId
    AssociationPropertyMetadata:
      InstanceType: ${JumpboxInstanceType}
      SupportedImageOwnerAlias:
        - system
        - self
        - others
    Default: centos_7_04_64_20G_alibase_201701015.vhd
  JumpboxSystemDiskType:
    Type: String
    Label:
      en: System Disk Category
      zh-cn: 系统盘类型
    Description:
      en: '<font color=''blue''><b>Optional values:</b></font><br>[cloud_efficiency: <font color=''green''>Efficient Cloud Disk</font>]<br>[cloud_ssd: <font color=''green''>SSD Cloud Disk</font>]<br>[cloud_essd: <font color=''green''>ESSD Cloud Disk</font>]<br>[cloud: <font color=''green''>Cloud Disk</font>]<br>[ephemeral_ssd: <font color=''green''>Local SSD Cloud Disk</font>]'
      zh-cn: '<font color=''blue''><b>可选值：</b></font><br>[cloud_efficiency: <font color=''green''>高效云盘</font>]<br>[cloud_ssd: <font color=''green''>SSD云盘</font>]<br>[cloud_essd: <font color=''green''>ESSD云盘</font>]<br>[cloud: <font color=''green''>普通云盘</font>]<br>[ephemeral_ssd: <font color=''green''>本地SSD盘</font>]'
    AssociationProperty: ALIYUN::ECS::Disk::SystemDiskCategory
    AssociationPropertyMetadata:
      InstanceType: JumpboxInstanceType
      ZoneId: ZoneId
  JumpboxPassword:
    Type: String
    Label:
      en: Instance Password
      zh-cn: 实例密码
    Description:
      en: 'Length 8-30, must contain upper case letters, lower case letters, Numbers, special symbols three;<br>special characters include: ()''~!@#$%^&*_-+=|{}[]:;''<>,.?/'
      zh-cn: 长度8-30，必须包含大写字母、小写字母、数字、特殊符号3个；<br>特殊字符包括:()` ~!@#$%^&*_-+=|{}[];` <>，.?/
    ConstraintDescription:
      en: 'Length 8-30, must contain upper case letters, lower case letters, Numbers, special symbols three; special characters include: ()`~!@#$%^&*_-+=|{}[]:;''<>,.?/'
      zh-cn: 长度8-30，必须包含大写字母、小写字母、数字、特殊符号三种；特殊字符包括：()`~!@#$%^&*_-+=|{}[]:;' <>,.?/
    AllowedPattern: '[a-zA-Z0-9-\(\)\`\~\!@\#\$%\^&\*-+=\|\{\}\[\]\:\;\‘\,\.\?\/]*'
    MinLength: 8
    MaxLength: 30
    NoEcho: true
  LoadBalancerSpec:
    Type: String
    Label:
      en: Specifications
      zh-cn: 规格
    Description:
      en: "Instance specifications,</br>see detail: </b><a href='https://www.alibabacloud.com/help/doc-detail/85939.html' target='_blank'><b><font color='blue'>Performance Support Type</b></font></a>"
      zh-cn: 实例规格，</br>详见：</b><a href='https://help.aliyun.com/document_detail/85939.html' target='_blank'><b><font color='blue'>性能保障型</b></font></a>
    Default: slb.s1.small
  Category:
    AssociationPropertyMetadata:
      LocaleKey: RDSCategory
    Default: Null
    Required: false
    AllowedValues:
      - Basic
      - HighAvailability
      - cluster
    Label:
      zh-cn: 实例系列
      en: Category
    Type: String
  EngineVersion:
    Type: String
    Label:
      en: Engine Version
      zh-cn: 数据库引擎版本
    Description:
      en: RDS MySQL Engine Version
      zh-cn: RDS MySQL 数据库版本号
    AssociationProperty: ALIYUN::RDS::Engine::EngineVersion
    AssociationPropertyMetadata:
      Engine: MySQL
    Default: '8.0'
  DBInstanceClass:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    Description:
      en: 'Select the instance specification based on the type of database engine and the available area support;<br>See detail: <a href=''https://www.alibabacloud.com/help/doc-detail/26312.htm'' target=''_blank''><b><font color=''blue''>Instance specification sheet</font></b></a>.'
      zh-cn: '根据数据库引擎类型和可用区域支持选择实例规格;<br>详见: <a href=''https://help.aliyun.com/document_detail/26312.html'' target=''_blank''><b><font color=''blue''>实例规格表</font></b></a>.'
    AssociationProperty: ALIYUN::RDS::Instance::InstanceType
    AssociationPropertyMetadata:
      Engine: MySQL
      Category: ${Category}
      EngineVersion: ${EngineVersion}
      ZoneId: ${ZoneId}
    Default: rds.mysql.s1.small
  DBInstanceStorage:
    Type: Number
    Label:
      en: Instance Storage
      zh-cn: 存储大小
    Description:
      en: 'Incrementing in every 5G, unit: GB'
      zh-cn: 每5GB进行递增，单位:GB
    ConstraintDescription:
      en: '[5, 2000] Incrementing in every 5 GB, unit: GB'
      zh-cn: '[5, 2000] 每 5G 递增，单位：GB'
    Default: 20
    MinValue: 5
    MaxValue: 2000
  DBName:
    Type: String
    Label:
      en: Database Name
      zh-cn: 数据库名称
    Description:
      en: Consists of lowercase letters, Numbers and special characters (-_).
      zh-cn: 由小写字母、数字和特殊字符(-_)组成。
    ConstraintDescription:
      en: Consists of lowercase letters, numbers, and special characters (-_), beginning with a letter, ending with a letter or number, up to 64 characters.
      zh-cn: 由小写字母、数字和特殊字符(-_)组成，以字母开头，以字母或数字结尾，最多64个字符，
    Default: dbname
    AllowedPattern: ^[a-z]+[a-z0-9\-\_]*[a-z0-9]+$
    MinLength: 1
    MaxLength: 63
  MasterUserName:
    Type: String
    Label:
      en: User Name
      zh-cn: 用户名称
    Description:
      en: A maximum of 16 characters, consisting of lowercase letters, numbers, underscores, starting with a letter, and ending with a letter or number.
      zh-cn: 最多16个字符，包括小写字母、数字、下划线、字母开头、字母或数字结尾。
    Default: dbname
    MinLength: 1
    MaxLength: 16
  MasterDBPassword:
    Type: String
    Label:
      en: User Password
      zh-cn: 用户密码
    Description:
      en: "Must include three types: uppercase/lowercase letters, numbers, and special characters; length 8–32 characters."
      zh-cn: 大/小写字母、数字和特殊字符占3种，8-32位。
    ConstraintDescription:
      en: 'Length 8-30, must contain upper case letters, lower case letters, Numbers, special symbols three; special characters include: ()`~!@#$%^&*_-+=|{}[]:;''<>,.?/'
      zh-cn: 长度8-30，必须包含大写字母、小写字母、数字、特殊符号三种；特殊字符包括：()`~!@#$%^&*_-+=|{}[]:;' <>,.?/
    AllowedPattern: '[a-zA-Z0-9-\!\@\#\$\%\^\&\*\(\)\_\+-=]*'
    MinLength: 8
    MaxLength: 32
    NoEcho: true
Resources:
  WebServerConditionHandle:
    Type: ALIYUN::ROS::WaitConditionHandle
    Properties: { }
  RosWaitCondition:
    Type: ALIYUN::ROS::WaitCondition
    Properties:
      Count: 1
      Handle:
        Ref: WebServerConditionHandle
      Timeout: 3600
  CreateLoadBalancer:
    Type: ALIYUN::SLB::LoadBalancer
    Properties:
      AddressType: internet
      InternetChargeType: paybytraffic
      LoadBalancerName: PublicLoadBalancer
      LoadBalancerSpec:
        Ref: LoadBalancerSpec
      MasterZoneId:
        Ref: ZoneId
  CreateListener:
    Type: ALIYUN::SLB::Listener
    Properties:
      BackendServerPort: 80
      Bandwidth: 1
      HealthCheck:
        HealthyThreshold: 3
        Interval: 2
        Timeout: 5
        UnhealthyThreshold: 3
      ListenerPort: '80'
      LoadBalancerId:
        Ref: CreateLoadBalancer
      Persistence:
        PersistenceTimeout: 1
        StickySession: 'off'
        StickySessionType: insert
        XForwardedFor: 'on'
      Protocol: tcp
      Scheduler: wrr
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Properties:
      CidrBlock: 192.168.0.0/16
      VpcName: WordPress-PhpMyAdmin
  VSwitch1:
    Type: ALIYUN::ECS::VSwitch
    Properties:
      ZoneId:
        Ref: ZoneId
      VpcId:
        Ref: EcsVpc
      CidrBlock: 192.168.1.0/24
      VSwitchName: VSwitch1-x
  Database:
    Type: ALIYUN::RDS::DBInstance
    Properties:
      AllocatePublicConnection: true
      VpcId:
        Ref: EcsVpc
      VSwitchId:
        Ref: VSwitch1
      DBInstanceClass:
        Ref: DBInstanceClass
      DBInstanceStorage:
        Ref: DBInstanceStorage
      DBMappings:
        - CharacterSetName: utf8
          DBName:
            Ref: DBName
      Engine: MySQL
      Category:
        Ref: Category
      EngineVersion:
        Ref: EngineVersion
      MasterUserPassword:
        Ref: MasterDBPassword
      MasterUsername:
        Ref: MasterUserName
      SecurityIPList: 0.0.0.0/0
  NatEip:
    Type: ALIYUN::VPC::EIP
    Properties:
      InternetChargeType: PayByTraffic
  NatGateway:
    Type: ALIYUN::VPC::NatGateway
    Properties:
      VpcId:
        Ref: EcsVpc
      VSwitchId:
        Ref: VSwitch1
      Description: NAT_Gateway_OSSFS
      NatGatewayName:
        Fn::Join:
          - '-'
          - - StackId
            - Ref: ALIYUN::StackId
    DependsOn: VSwitch1
  EIPBind:
    Type: ALIYUN::VPC::EIPAssociation
    Properties:
      InstanceId:
        Ref: NatGateway
      AllocationId:
        Ref: NatEip
  SecurityGroupDefault:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      VpcId:
        Ref: EcsVpc
      SecurityGroupEgress:
        - DestCidrIp: 0.0.0.0/0
          IpProtocol: all
          NicType: internet
          PortRange: '-1/-1'
          Priority: 1
        - DestCidrIp: 0.0.0.0/0
          IpProtocol: all
          NicType: intranet
          PortRange: '-1/-1'
          Priority: 1
      SecurityGroupIngress:
        - IpProtocol: tcp
          NicType: internet
          PortRange: 80/80
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
      SecurityGroupName: WordPress-PhpMyAdmin
  Jumpbox:
    Type: ALIYUN::ECS::Instance
    Properties:
      VpcId:
        Ref: EcsVpc
      VSwitchId:
        Ref: VSwitch1
      SecurityGroupId:
        Ref: SecurityGroupDefault
      ImageId:
        Ref: JumpboxImageId
      AllocatePublicIP: false
      InstanceType:
        Ref: JumpboxInstanceType
      Password:
        Ref: JumpboxPassword
      UserData:
        Fn::Sub: |-
          #!/bin/bash
          if [ ! -f .ros.provision ]; then
            echo "Name: wordpress-service" > .ros.provision
          fi          
          name=$(grep "^Name:" .ros.provision | awk -F':' '{print $2}' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [[ "$name" != "wordpress-service" ]]; then
            echo "wordpress-service installed, skip"
            exit 0
          fi
          
          if ! grep -q "^Step1: Install Environment$" .ros.provision; then
            echo "#########################"
            echo "# Install Environment"
            echo "#########################"
            yum -y install httpd httpd-manual mod_ssl mod_perl mod_auth_mysql sysbench
            systemctl start httpd
            systemctl enable httpd
            systemctl status httpd
          
            # Remi EL7 的 PHP 8.2 最高仅到 8.2.20，低于安全基线；改为编译固定校验的安全版本。
            sh -eu <<'ROS_PHP_BUILD'
          PHP_BUILD_DIR=$(mktemp -d /tmp/ros-php.XXXXXX)
          cd "$PHP_BUILD_DIR"
          # 归档仓库仅用于本次 PHP 编译依赖，不改系统全局仓库配置。
          cat > yum.conf <<'ROS_PHP_YUM'
          [main]
          reposdir=/dev/null
          gpgcheck=1
          [ros-php-base]
          name=CentOS 7 PHP build dependencies
          baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/os/$basearch/
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
          [ros-php-updates]
          name=CentOS 7 PHP build dependency updates
          baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/updates/$basearch/
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
          [ros-php-epel-archive]
          name=EPEL 7 archive PHP build dependencies
          baseurl=https://mirrors.aliyun.com/epel-archive/7/$basearch/
          gpgkey=https://mirrors.aliyun.com/epel/RPM-GPG-KEY-EPEL-7
          ROS_PHP_YUM
          # 构建依赖对应原 php-gd、php-ldap、php-odbc、php-xml、php-soap、php-mbstring 扩展。
          yum -c "$PHP_BUILD_DIR/yum.conf" install -y httpd-devel gcc make pkgconfig curl xz libxml2-devel sqlite-devel zlib-devel perl-core libpng-devel libjpeg-turbo-devel freetype-devel openldap-devel unixODBC-devel oniguruma-devel autoconf
          # PHP 使用独立的受维护 OpenSSL，避免旧系统库的 API 兼容问题。
          OPENSSL_PREFIX=/opt/ros/php/openssl-3.5.9
          # 镜像仅提供传输备选，每次下载均须通过同一官方 SHA256 校验。
          OPENSSL_DOWNLOADED=0
          for OPENSSL_URL in \
              https://gh-proxy.com/https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz \
              https://dev-www.libreoffice.org/src/openssl-3.5.9.tar.gz \
              https://sources.immortalwrt.org/openssl-3.5.9.tar.gz \
              https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz; do
              if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 15 --max-time 1800 -o openssl.tar.gz "$OPENSSL_URL" &&
                  printf '%s\n' '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | sha256sum -c -; then
                  OPENSSL_DOWNLOADED=1
                  break
              fi
          done
          [ "$OPENSSL_DOWNLOADED" -eq 1 ] || exit 1
          tar -xzf openssl.tar.gz
          cd openssl-3.5.9
          ./config --prefix="$OPENSSL_PREFIX" --libdir=lib --openssldir=/etc/pki/tls shared
          make -j2
          make install_sw
          cd "$PHP_BUILD_DIR"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 1200 -o php.tar.xz https://www.php.net/distributions/php-8.3.36.tar.xz
          printf '%s\n' 'dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd  php.tar.xz' | sha256sum -c -
          tar -xJf php.tar.xz
          cd php-8.3.36
          PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$OPENSSL_PREFIX/lib" ./configure --prefix=/opt/ros/php/8.3.36 --with-config-file-path=/opt/ros/php/8.3.36/etc --with-config-file-scan-dir=/opt/ros/php/8.3.36/etc/php.d --with-apxs2=/usr/bin/apxs --with-openssl --with-zlib --enable-mysqlnd --with-mysqli=mysqlnd --with-pdo-mysql=mysqlnd --enable-gd --with-jpeg --with-freetype --with-libdir=lib64 --with-ldap --with-unixODBC=/usr --enable-mbstring --enable-soap --enable-opcache
          make -j2
          make install
          mkdir -p /opt/ros/php/8.3.36/etc/php.d
          cp php.ini-production /opt/ros/php/8.3.36/etc/php.ini
          printf '%s\n' 'zend_extension=opcache.so' > /opt/ros/php/8.3.36/etc/php.d/opcache.ini
          ln -sf /opt/ros/php/8.3.36/bin/php /usr/bin/php
          cd "$PHP_BUILD_DIR"
          # 原 php-xmlrpc 对应扩展自 PHP 8 移出核心，改用 PECL 源码构建后显式加载。
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o xmlrpc.tgz https://pecl.php.net/get/xmlrpc-1.0.0RC3.tgz
          printf '%s\n' '65ce03491782f9d9d5e9bc70bfe684255e5afa8486a2960c7a7cab033882a282  xmlrpc.tgz' | sha256sum -c -
          tar -xzf xmlrpc.tgz
          cd xmlrpc-1.0.0RC3
          /opt/ros/php/8.3.36/bin/phpize
          ./configure --with-php-config=/opt/ros/php/8.3.36/bin/php-config
          make -j2
          make install
          printf '%s\n' 'extension=xmlrpc.so' > /opt/ros/php/8.3.36/etc/php.d/xmlrpc.ini
          cd "$PHP_BUILD_DIR"
          # 原 php-pear 依赖的 --with-pear 自 PHP 8 移除，改用官方离线安装器。
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o install-pear-nozlib.phar https://pear.php.net/install-pear-nozlib.phar
          printf '%s\n' 'a71349da29f1a6e3f0792695b167e582375a93c70c0e9d35e7c4675697c5f039  install-pear-nozlib.phar' | sha256sum -c -
          /opt/ros/php/8.3.36/bin/php -n -d memory_limit=-1 install-pear-nozlib.phar -d /opt/ros/php/8.3.36/lib/php -b /opt/ros/php/8.3.36/bin
          cat > /etc/httpd/conf.d/ros-php.conf <<'ROS_PHP_APACHE'
          <FilesMatch \.php$>
              SetHandler application/x-httpd-php
          </FilesMatch>
          DirectoryIndex index.php index.html
          ROS_PHP_APACHE
          php -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 1);'
          php -i | grep -q '^OpenSSL Library Version => OpenSSL 3\.5\.9 '
          # 原 Remi 扩展清单逐项核对实际加载状态，php-mysqlnd 由 mysqli 与 pdo_mysql 承接。
          for PHP_EXTENSION in gd ldap odbc mysqli pdo pdo_mysql mbstring soap xml xmlrpc openssl; do
              php -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' "$PHP_EXTENSION"
          done
          php -v | grep -q 'Zend OPcache'
          /opt/ros/php/8.3.36/bin/pear version
          httpd -t
          httpd -M 2>/dev/null | grep -q 'php_module'
          ROS_PHP_BUILD
            [ "$?" -eq 0 ] || exit 1
            echo "<?php phpinfo(); ?>" > /var/www/html/phpinfo.php
            systemctl restart httpd
            echo "Step1: Install Environment" >> .ros.provision
          else
            echo "#########################"
            echo "# Environment has been installed"
            echo "#########################"
          fi
          
          if ! grep -q "^Step2: Install and Config WordPress$" .ros.provision; then
            echo "################################"
            echo "# Install and Config WordPress"
            echo "################################"
            wget https://ros-template-resources.oss-cn-beijing.aliyuncs.com/WordPress/wordpress-6.3.1-zh_CN.tar.gz
            tar -xvf wordpress-6.3.1-zh_CN.tar.gz -C /var/www/html
            mv /var/www/html/wordpress/* /var/www/html
            chown -R apache:apache /var/www/html/wordpress
            chmod -R 755 /var/www/html/wordpress
            mv /var/www/html/wp-config-sample.php /var/www/html/wp-config.php
            sed -i 's/localhost/${Database.PublicConnectionString}/' /var/www/html/wp-config.php
            sed -i 's/username_here/${MasterUserName}/' /var/www/html/wp-config.php
            sed -i 's/password_here/${MasterDBPassword}/' /var/www/html/wp-config.php
            sed -i 's/database_name_here/${DBName}/' /var/www/html/wp-config.php
            systemctl restart httpd
            echo "Step2: Install and Config WordPress" >> .ros.provision
          else
            echo "#########################"
            echo "# WordPress has been installed and configed"
            echo "#########################"
          fi
          ${WebServerConditionHandle.CurlCli} --data-binary '{"status": "SUCCESS"}'
      SystemDiskCategory:
        Ref: JumpboxSystemDiskType
    DependsOn:
      - Database
  NewElasticIP:
    Type: ALIYUN::VPC::EIP
    Properties:
      InternetChargeType: PayByTraffic
  ElasticIPAssociation:
    Type: ALIYUN::VPC::EIPAssociation
    Properties:
      InstanceId:
        Ref: Jumpbox
      AllocationId:
        Ref: NewElasticIP
  SNatTableEntry:
    Type: ALIYUN::ECS::SNatEntry
    Properties:
      SNatIp:
        Fn::GetAtt:
          - NatEip
          - EipAddress
      SNatTableId:
        Fn::GetAtt:
          - NatGateway
          - SNatTableId
      SourceVSwitchId:
        Fn::GetAtt:
          - VSwitch1
          - VSwitchId
    DependsOn: EIPBind
  WebScalingGroup:
    Type: ALIYUN::ESS::ScalingGroup
    Properties:
      VpcId:
        Ref: EcsVpc
      VSwitchId:
        Ref: VSwitch1
      DBInstanceIds:
        - Ref: Database
      LoadBalancerIds:
        - Ref: CreateLoadBalancer
      MaxSize: 2
      MinSize: 2
    DependsOn:
      - Database
      - SecurityGroupDefault
  WebScalingConfiguration:
    Type: ALIYUN::ESS::ScalingConfiguration
    Properties:
      SecurityGroupId:
        Ref: SecurityGroupDefault
      ImageId:
        Ref: JumpboxImageId
      InstanceType:
        Ref: JumpboxInstanceType
      ScalingGroupId:
        Ref: WebScalingGroup
      SystemDiskCategory:
        Ref: JumpboxSystemDiskType
      UserData:
        Fn::Sub: |-
          #!/bin/bash
          if [ ! -f .ros.provision ]; then
            echo "Name: wordpress-service" > .ros.provision
          fi          
          name=$(grep "^Name:" .ros.provision | awk -F':' '{print $2}' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [[ "$name" != "wordpress-service" ]]; then
            echo "wordpress-service installed, skip"
            exit 0
          fi
          
          if ! grep -q "^Step1: Install Environment$" .ros.provision; then
            echo "#########################"
            echo "# Install Environment"
            echo "#########################"
            yum -y install httpd httpd-manual mod_ssl mod_perl mod_auth_mysql sysbench
            systemctl start httpd
            systemctl enable httpd
            systemctl status httpd
          
            # Remi EL7 的 PHP 8.2 最高仅到 8.2.20，低于安全基线；改为编译固定校验的安全版本。
            sh -eu <<'ROS_PHP_BUILD'
          PHP_BUILD_DIR=$(mktemp -d /tmp/ros-php.XXXXXX)
          cd "$PHP_BUILD_DIR"
          # 归档仓库仅用于本次 PHP 编译依赖，不改系统全局仓库配置。
          cat > yum.conf <<'ROS_PHP_YUM'
          [main]
          reposdir=/dev/null
          gpgcheck=1
          [ros-php-base]
          name=CentOS 7 PHP build dependencies
          baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/os/$basearch/
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
          [ros-php-updates]
          name=CentOS 7 PHP build dependency updates
          baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/updates/$basearch/
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
          [ros-php-epel-archive]
          name=EPEL 7 archive PHP build dependencies
          baseurl=https://mirrors.aliyun.com/epel-archive/7/$basearch/
          gpgkey=https://mirrors.aliyun.com/epel/RPM-GPG-KEY-EPEL-7
          ROS_PHP_YUM
          # 构建依赖对应原 php-gd、php-ldap、php-odbc、php-xml、php-soap、php-mbstring 扩展。
          yum -c "$PHP_BUILD_DIR/yum.conf" install -y httpd-devel gcc make pkgconfig curl xz libxml2-devel sqlite-devel zlib-devel perl-core libpng-devel libjpeg-turbo-devel freetype-devel openldap-devel unixODBC-devel oniguruma-devel autoconf
          # PHP 使用独立的受维护 OpenSSL，避免旧系统库的 API 兼容问题。
          OPENSSL_PREFIX=/opt/ros/php/openssl-3.5.9
          # 镜像仅提供传输备选，每次下载均须通过同一官方 SHA256 校验。
          OPENSSL_DOWNLOADED=0
          for OPENSSL_URL in \
              https://gh-proxy.com/https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz \
              https://dev-www.libreoffice.org/src/openssl-3.5.9.tar.gz \
              https://sources.immortalwrt.org/openssl-3.5.9.tar.gz \
              https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz; do
              if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 15 --max-time 1800 -o openssl.tar.gz "$OPENSSL_URL" &&
                  printf '%s\n' '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | sha256sum -c -; then
                  OPENSSL_DOWNLOADED=1
                  break
              fi
          done
          [ "$OPENSSL_DOWNLOADED" -eq 1 ] || exit 1
          tar -xzf openssl.tar.gz
          cd openssl-3.5.9
          ./config --prefix="$OPENSSL_PREFIX" --libdir=lib --openssldir=/etc/pki/tls shared
          make -j2
          make install_sw
          cd "$PHP_BUILD_DIR"
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 1200 -o php.tar.xz https://www.php.net/distributions/php-8.3.36.tar.xz
          printf '%s\n' 'dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd  php.tar.xz' | sha256sum -c -
          tar -xJf php.tar.xz
          cd php-8.3.36
          PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$OPENSSL_PREFIX/lib" ./configure --prefix=/opt/ros/php/8.3.36 --with-config-file-path=/opt/ros/php/8.3.36/etc --with-config-file-scan-dir=/opt/ros/php/8.3.36/etc/php.d --with-apxs2=/usr/bin/apxs --with-openssl --with-zlib --enable-mysqlnd --with-mysqli=mysqlnd --with-pdo-mysql=mysqlnd --enable-gd --with-jpeg --with-freetype --with-libdir=lib64 --with-ldap --with-unixODBC=/usr --enable-mbstring --enable-soap --enable-opcache
          make -j2
          make install
          mkdir -p /opt/ros/php/8.3.36/etc/php.d
          cp php.ini-production /opt/ros/php/8.3.36/etc/php.ini
          printf '%s\n' 'zend_extension=opcache.so' > /opt/ros/php/8.3.36/etc/php.d/opcache.ini
          ln -sf /opt/ros/php/8.3.36/bin/php /usr/bin/php
          cd "$PHP_BUILD_DIR"
          # 原 php-xmlrpc 对应扩展自 PHP 8 移出核心，改用 PECL 源码构建后显式加载。
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o xmlrpc.tgz https://pecl.php.net/get/xmlrpc-1.0.0RC3.tgz
          printf '%s\n' '65ce03491782f9d9d5e9bc70bfe684255e5afa8486a2960c7a7cab033882a282  xmlrpc.tgz' | sha256sum -c -
          tar -xzf xmlrpc.tgz
          cd xmlrpc-1.0.0RC3
          /opt/ros/php/8.3.36/bin/phpize
          ./configure --with-php-config=/opt/ros/php/8.3.36/bin/php-config
          make -j2
          make install
          printf '%s\n' 'extension=xmlrpc.so' > /opt/ros/php/8.3.36/etc/php.d/xmlrpc.ini
          cd "$PHP_BUILD_DIR"
          # 原 php-pear 依赖的 --with-pear 自 PHP 8 移除，改用官方离线安装器。
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o install-pear-nozlib.phar https://pear.php.net/install-pear-nozlib.phar
          printf '%s\n' 'a71349da29f1a6e3f0792695b167e582375a93c70c0e9d35e7c4675697c5f039  install-pear-nozlib.phar' | sha256sum -c -
          /opt/ros/php/8.3.36/bin/php -n -d memory_limit=-1 install-pear-nozlib.phar -d /opt/ros/php/8.3.36/lib/php -b /opt/ros/php/8.3.36/bin
          cat > /etc/httpd/conf.d/ros-php.conf <<'ROS_PHP_APACHE'
          <FilesMatch \.php$>
              SetHandler application/x-httpd-php
          </FilesMatch>
          DirectoryIndex index.php index.html
          ROS_PHP_APACHE
          php -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 1);'
          php -i | grep -q '^OpenSSL Library Version => OpenSSL 3\.5\.9 '
          # 原 Remi 扩展清单逐项核对实际加载状态，php-mysqlnd 由 mysqli 与 pdo_mysql 承接。
          for PHP_EXTENSION in gd ldap odbc mysqli pdo pdo_mysql mbstring soap xml xmlrpc openssl; do
              php -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' "$PHP_EXTENSION"
          done
          php -v | grep -q 'Zend OPcache'
          /opt/ros/php/8.3.36/bin/pear version
          httpd -t
          httpd -M 2>/dev/null | grep -q 'php_module'
          ROS_PHP_BUILD
            [ "$?" -eq 0 ] || exit 1
            echo "<?php phpinfo(); ?>" > /var/www/html/phpinfo.php
            systemctl restart httpd
            echo "Step1: Install Environment" >> .ros.provision
          else
            echo "#########################"
            echo "# Environment has been installed"
            echo "#########################"
          fi
          
          if ! grep -q "^Step2: Install and Config WordPress$" .ros.provision; then
            echo "################################"
            echo "# Install and Config WordPress"
            echo "################################"
            wget https://ros-template-resources.oss-cn-beijing.aliyuncs.com/WordPress/wordpress-6.3.1-zh_CN.tar.gz
            tar -xvf wordpress-6.3.1-zh_CN.tar.gz -C /var/www/html
            mv /var/www/html/wordpress/* /var/www/html
            chown -R apache:apache /var/www/html/wordpress
            chmod -R 755 /var/www/html/wordpress
            mv /var/www/html/wp-config-sample.php /var/www/html/wp-config.php
            sed -i 's/localhost/${Database.PublicConnectionString}/' /var/www/html/wp-config.php
            sed -i 's/username_here/${MasterUserName}/' /var/www/html/wp-config.php
            sed -i 's/password_here/${MasterDBPassword}/' /var/www/html/wp-config.php
            sed -i 's/database_name_here/${DBName}/' /var/www/html/wp-config.php
            systemctl restart httpd
            echo "Step2: Install and Config WordPress" >> .ros.provision
          else
            echo "#########################"
            echo "# WordPress has been installed and configed"
            echo "#########################"
          fi
