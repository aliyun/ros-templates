ROSTemplateFormatVersion: '2015-09-01'
Description:
  zh-cn: 创建WordPress环境，包括ECS实例、RDS数据库、安全组配置及自动部署脚本，支持自定义资源属性。
  en: Provision a WordPress environment encompassing an ECS (Elastic Cloud Server)
    instance, an RDS (Relational Database Service) database, security group configurations,
    and automated deployment scripts, with support for customizable resource attributes.
Parameters:
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR Block
      zh-cn: 专有网络网段
    Description:
      en: "The IP address range of the VPC in CIDR notation; <br>you can use the following IP address ranges: <br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>"
      zh-cn: 专有网络IP地址段范围，<br>您可以使用以下的IP地址段:<br><font color='green'>[10.0.0.0/8]</font><br><font
        color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
    Default: 192.168.0.0/16
    AllowedValues:
      - 192.168.0.0/16
      - 172.16.0.0/12
      - 10.0.0.0/8
  ZoneId:
    Type: String
    Label:
      en: VSwitch Availability Zone
      zh-cn: 可用区ID
    Description:
      en: "Availability Zone ID,<br><b>note: <font color='blue'>Before selecting, please confirm that the Availability Zone supports the specification of creating RDS and ECS resources.</font></b>"
      zh-cn: 可用区ID。<br><b>注： <font color='blue'>选择可用区前请确认该可用区是否支持创建RDS及ECS资源的规格。</font></b>
    AssociationProperty: ALIYUN::ECS::Instance:ZoneId
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      en: CIDR block of the created VSwitch; it must be within the VPC CIDR block.
      zh-cn: 交换机网段，必须为专有网络子网段。
    Default: 192.168.0.0/24
  InstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    Description:
      en: "Fill in the specifications that can be used under the VSwitch availability zone;</b></font><br>general specifications: <font color='red'><b>ecs.c5.large</b></font><br>note: a few zones do not support general specifications<br>see detail: <a href='https://www.alibabacloud.com/help/en/doc-detail/25378.html' target='_blank'><b><font color='blue'>Instance Specification Family.</font></a></b>"
      zh-cn: 填写VSwitch可用区下可使用的规格；<br>通用规格：<font color='red'><b>ecs.c5.large</b></font><br>注：可用区可能不支持通用规格<br>规格详见：<a
        href='https://help.aliyun.com/document_detail/25378.html' target='_blank'><b><font
        color='blue'>实例规格族。</font></a></b>
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ZoneId
  SystemDiskCategory:
    Type: String
    Label:
      en: System Disk Type
      zh-cn: 系统盘类型
    Description:
      en: '<font color=''blue''><b>Optional values:</b></font><br>[cloud_efficiency: <font color=''green''>Efficient Cloud Disk</font>]<br>[cloud_ssd: <font color=''green''>SSD Cloud Disk</font>]<br>[cloud_essd: <font color=''green''>ESSD Cloud Disk</font>]<br>[cloud: <font color=''green''>Cloud Disk</font>]<br>[ephemeral_ssd: <font color=''green''>Local SSD Cloud Disk</font>]'
      zh-cn: '<font color=''blue''><b>可选值：</b></font><br>[cloud_efficiency: <font color=''green''>高效云盘</font>]<br>[cloud_ssd: <font color=''green''>SSD云盘</font>]<br>[cloud_essd: <font color=''green''>ESSD云盘</font>]<br>[cloud: <font color=''green''>普通云盘</font>]<br>[ephemeral_ssd: <font color=''green''>本地SSD盘</font>]'
    AssociationProperty: ALIYUN::ECS::Disk::SystemDiskCategory
    AssociationPropertyMetadata:
      LocaleKey: DiskCategory
      InstanceType: ${InstanceType}
      ZoneId: ZoneId
  InstancePassword:
    Type: String
    NoEcho: true
    Label:
      en: Instance Password
      zh-cn: 实例密码
    Description:
      en: Server login password, Length 8-30, must contain three(Capital letters,
        lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol
        in).
      zh-cn: 服务器登录密码,长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）。
    ConstraintDescription:
      en: Length 8-30, must contain three(Capital letters, lowercase letters, numbers,
        ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in).
      zh-cn: 长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ 中的特殊符号）。
    AssociationProperty: ALIYUN::ECS::Instance::Password
  EngineVersion:
    Type: String
    Label:
      en: Engine Version
      zh-cn: 数据库版本号
    AssociationProperty: ALIYUN::RDS::Engine::EngineVersion
    AssociationPropertyMetadata:
      Engine: MySQL
    Default: "8.0"
  DBInstanceClass:
    Type: String
    Label:
      en: Instance Class
      zh-cn: 实例规格
    AssociationProperty: ALIYUN::RDS::Instance::InstanceType
    AssociationPropertyMetadata:
      ZoneId: ${ZoneId}
      EngineVersion: ${EngineVersion}
      Engine: MySQL
      Category: HighAvailability
      DBInstanceStorageType: cloud_essd
    Default: 'rds.mysql.t1.small'
  DBInstanceStorage:
    Type: Number
    Label:
      en: Instance Storage
      zh-cn: 实例存储
    Description:
      en: 'Incrementing in every 5G, unit: GB'
      zh-cn: 每5G递增，单位：GB
    ConstraintDescription:
      en: '[5, 2000] Incrementing in every 5G, unit: GB'
      zh-cn: '[5, 2000] 每 5G 递增，单位：GB'
    MinValue: 5
    MaxValue: 2000
    Default: 20
  DBName:
    Type: String
    Label:
      en: DB Name
      zh-cn: 数据库名
    Description:
      en: Name of WordPress database
      zh-cn: WordPress数据库名
    ConstraintDescription:
      en: Consist of 2 to 64 characters of lowercase letters, underline. Must begin
        with a letter and be end with an alphanumeric character.
      zh-cn: 由 2 到 64 个小写字母组成，下划线。必须以字母开头，以字母数字字符结尾。
    Default: wordpress
    MinLength: 2
    MaxLength: 64
  DBUser:
    Type: String
    Label:
      en: DB Username
      zh-cn: 数据库账号
    Description:
      en: Username of WordPress database
      zh-cn: WordPress数据库账号
    ConstraintDescription:
      en: Consist of 2 to 16 characters of lowercase letters, underline. Must begin
        with a letter and be end with an alphanumeric character.
      zh-cn: 由 2 到 16 个小写字母组成，下划线。必须以字母开头，以字母数字字符结尾。
    Default: wpuser
    MinLength: 2
    MaxLength: 16
  DBPassword:
    Type: String
    Label:
      en: DB Password
      zh-cn: 数据库密码
    Description:
      en: WordPress database password, consisting of letters, numbers, and underline(_),
        is 8 to 32 characters long.
      zh-cn: WordPress数据库密码，由字母、数字、下划线（_）组成，长度为8~32个字符。
    ConstraintDescription:
      en: Consisting of letters, numbers, and underline(_),
        is 8 to 32 characters long.
      zh-cn: 由字母、数字、下划线（_）组成，长度为8~32个字符。
    MinLength: 8
    MaxLength: 32
    NoEcho: true
Resources:
  Vpc:
    Type: ALIYUN::ECS::VPC
    Properties:
      CidrBlock:
        Ref: VpcCidrBlock
      VpcName: wordpress_vpc
  VSwitch:
    Type: ALIYUN::ECS::VSwitch
    Properties:
      ZoneId:
        Ref: ZoneId
      VpcId:
        Fn::GetAtt:
          - Vpc
          - VpcId
      CidrBlock:
        Ref: VSwitchCidrBlock
  Database:
    Type: ALIYUN::RDS::DBInstance
    Properties:
      ZoneId:
        Ref: ZoneId
      VPCId:
        Ref: Vpc
      VSwitchId:
        Ref: VSwitch
      DBInstanceClass:
        Ref: DBInstanceClass
      DBInstanceDescription: DataBase
      DBInstanceStorage:
        Ref: DBInstanceStorage
      DBMappings:
        - CharacterSetName: utf8
          DBName:
            Ref: DBName
      Engine: MySQL
      EngineVersion:
        Ref: EngineVersion
      MasterUserPassword:
        Ref: DBPassword
      MasterUsername:
        Ref: DBUser
      SecurityIPList: 0.0.0.0/0
      AllocatePublicConnection: true
      Category: HighAvailability
      DBInstanceStorageType: cloud_essd
  WebServerConditionHandle:
    Type: ALIYUN::ROS::WaitConditionHandle
    Properties: { }
  RosWaitCondition:
    Type: ALIYUN::ROS::WaitCondition
    Properties:
      Count: 1
      Handle:
        Ref: WebServerConditionHandle
      Timeout: 3600
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      VpcId:
        Ref: Vpc
      SecurityGroupName: wordpress_sg
    Metadata:
      ALIYUN::ROS::Designer:
        id: 4740a2b8-d119-4bc8-956d-6b02e2d7aa9f
  SecurityGroupIngress:
    Type: ALIYUN::ECS::SecurityGroupIngress
    Properties:
      SecurityGroupId:
        Ref: SecurityGroup
      IpProtocol: all
      PortRange: -1/-1
      SourceCidrIp: 0.0.0.0/0
  WebServer:
    Type: ALIYUN::ECS::Instance
    Properties:
      VpcId:
        Ref: Vpc
      VSwitchId:
        Ref: VSwitch
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId: centos_7
      AllocatePublicIP: true
      InstanceType:
        Ref: InstanceType
      InternetMaxBandwidthOut: 80
      IoOptimized: optimized
      Password:
        Ref: InstancePassword
      SystemDiskCategory:
        Ref: SystemDiskCategory
    DependsOn: Database
  Command:
    Type: ALIYUN::ECS::Command
    Properties:
      Timeout: 3600
      CommandContent:
        Fn::Base64Encode:
          Fn::Sub: |-
            #!/bin/bash
            if [ ! -f .ros.provision ]; then
              echo "Name: wordpress-service" > .ros.provision
            fi          
            name=$(grep "^Name:" .ros.provision | awk -F':' '{print $2}' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [[ "$name" != "wordpress-service" ]]; then
              echo "wordpress-service installed, skip"
              exit 0
            fi
            
            if ! grep -q "^Step1: Install Environment$" .ros.provision; then
              echo "#########################"
              echo "# Install Environment"
              echo "#########################"
              yum -y install httpd httpd-manual mod_ssl mod_perl mod_auth_mysql sysbench
              systemctl start httpd
              systemctl enable httpd
              systemctl status httpd
            
              # Remi EL7 的 PHP 8.2 最高仅到 8.2.20，低于安全基线；改为编译固定校验的安全版本。
              sh -eu <<'ROS_PHP_BUILD'
            PHP_BUILD_DIR=$(mktemp -d /tmp/ros-php.XXXXXX)
            cd "$PHP_BUILD_DIR"
            # 归档仓库仅用于本次 PHP 编译依赖，不改系统全局仓库配置。
            cat > yum.conf <<'ROS_PHP_YUM'
            [main]
            reposdir=/dev/null
            gpgcheck=1
            [ros-php-base]
            name=CentOS 7 PHP build dependencies
            baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/os/$basearch/
            gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
            [ros-php-updates]
            name=CentOS 7 PHP build dependency updates
            baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/updates/$basearch/
            gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
            [ros-php-epel-archive]
            name=EPEL 7 archive PHP build dependencies
            baseurl=https://mirrors.aliyun.com/epel-archive/7/$basearch/
            gpgkey=https://mirrors.aliyun.com/epel/RPM-GPG-KEY-EPEL-7
            ROS_PHP_YUM
            # 构建依赖对应原 php-gd、php-ldap、php-odbc、php-xml、php-soap、php-mbstring 扩展。
            yum -c "$PHP_BUILD_DIR/yum.conf" install -y httpd-devel gcc make pkgconfig curl xz libxml2-devel sqlite-devel zlib-devel perl-core libpng-devel libjpeg-turbo-devel freetype-devel openldap-devel unixODBC-devel oniguruma-devel autoconf
            # PHP 使用独立的受维护 OpenSSL，避免旧系统库的 API 兼容问题。
            OPENSSL_PREFIX=/opt/ros/php/openssl-3.5.9
            # 镜像仅提供传输备选，每次下载均须通过同一官方 SHA256 校验。
            OPENSSL_DOWNLOADED=0
            for OPENSSL_URL in \
                https://dev-www.libreoffice.org/src/openssl-3.5.9.tar.gz \
                https://sources.immortalwrt.org/openssl-3.5.9.tar.gz \
                https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz; do
                if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 15 --max-time 1800 -o openssl.tar.gz "$OPENSSL_URL" &&
                    printf '%s\n' '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | sha256sum -c -; then
                    OPENSSL_DOWNLOADED=1
                    break
                fi
            done
            [ "$OPENSSL_DOWNLOADED" -eq 1 ] || exit 1
            tar -xzf openssl.tar.gz
            cd openssl-3.5.9
            ./config --prefix="$OPENSSL_PREFIX" --libdir=lib --openssldir=/etc/pki/tls shared
            make -j2
            make install_sw
            cd "$PHP_BUILD_DIR"
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 1200 -o php.tar.xz https://www.php.net/distributions/php-8.3.36.tar.xz
            printf '%s\n' 'dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd  php.tar.xz' | sha256sum -c -
            tar -xJf php.tar.xz
            cd php-8.3.36
            PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$OPENSSL_PREFIX/lib" ./configure --prefix=/opt/ros/php/8.3.36 --with-config-file-path=/opt/ros/php/8.3.36/etc --with-config-file-scan-dir=/opt/ros/php/8.3.36/etc/php.d --with-apxs2=/usr/bin/apxs --with-openssl --with-zlib --enable-mysqlnd --with-mysqli=mysqlnd --with-pdo-mysql=mysqlnd --enable-gd --with-jpeg --with-freetype --with-libdir=lib64 --with-ldap --with-unixODBC=/usr --enable-mbstring --enable-soap --enable-opcache
            make -j2
            make install
            mkdir -p /opt/ros/php/8.3.36/etc/php.d
            cp php.ini-production /opt/ros/php/8.3.36/etc/php.ini
            printf '%s\n' 'zend_extension=opcache.so' > /opt/ros/php/8.3.36/etc/php.d/opcache.ini
            ln -sf /opt/ros/php/8.3.36/bin/php /usr/bin/php
            cd "$PHP_BUILD_DIR"
            # 原 php-xmlrpc 对应扩展自 PHP 8 移出核心，改用 PECL 源码构建后显式加载。
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o xmlrpc.tgz https://pecl.php.net/get/xmlrpc-1.0.0RC3.tgz
            printf '%s\n' '65ce03491782f9d9d5e9bc70bfe684255e5afa8486a2960c7a7cab033882a282  xmlrpc.tgz' | sha256sum -c -
            tar -xzf xmlrpc.tgz
            cd xmlrpc-1.0.0RC3
            /opt/ros/php/8.3.36/bin/phpize
            ./configure --with-php-config=/opt/ros/php/8.3.36/bin/php-config
            make -j2
            make install
            printf '%s\n' 'extension=xmlrpc.so' > /opt/ros/php/8.3.36/etc/php.d/xmlrpc.ini
            cd "$PHP_BUILD_DIR"
            # 原 php-pear 依赖的 --with-pear 自 PHP 8 移除，改用官方离线安装器。
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o install-pear-nozlib.phar https://pear.php.net/install-pear-nozlib.phar
            printf '%s\n' 'a71349da29f1a6e3f0792695b167e582375a93c70c0e9d35e7c4675697c5f039  install-pear-nozlib.phar' | sha256sum -c -
            /opt/ros/php/8.3.36/bin/php -n -d memory_limit=-1 install-pear-nozlib.phar -d /opt/ros/php/8.3.36/lib/php -b /opt/ros/php/8.3.36/bin
            cat > /etc/httpd/conf.d/ros-php.conf <<'ROS_PHP_APACHE'
            <FilesMatch \.php$>
                SetHandler application/x-httpd-php
            </FilesMatch>
            DirectoryIndex index.php index.html
            ROS_PHP_APACHE
            php -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 1);'
            php -i | grep -q '^OpenSSL Library Version => OpenSSL 3\.5\.9 '
            # 原 Remi 扩展清单逐项核对实际加载状态，php-mysqlnd 由 mysqli 与 pdo_mysql 承接。
            for PHP_EXTENSION in gd ldap odbc mysqli pdo pdo_mysql mbstring soap xml xmlrpc openssl; do
                php -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' "$PHP_EXTENSION"
            done
            php -v | grep -q 'Zend OPcache'
            /opt/ros/php/8.3.36/bin/pear version
            httpd -t
            httpd -M 2>/dev/null | grep -q 'php_module'
            ROS_PHP_BUILD
              [ "$?" -eq 0 ] || exit 1
              echo "<?php phpinfo(); ?>" > /var/www/html/phpinfo.php
              systemctl restart httpd
              echo "Step1: Install Environment" >> .ros.provision
            else
              echo "#########################"
              echo "# Environment has been installed"
              echo "#########################"
            fi
            
            if ! grep -q "^Step2: Install and Config WordPress$" .ros.provision; then
              echo "################################"
              echo "# Install and Config WordPress"
              echo "################################"
              wget https://ros-template-resources.oss-cn-beijing.aliyuncs.com/WordPress/wordpress-6.3.1-zh_CN.tar.gz
              tar -xvf wordpress-6.3.1-zh_CN.tar.gz -C /var/www/html
              mv /var/www/html/wordpress/* /var/www/html
              chown -R apache:apache /var/www/html/wordpress
              chmod -R 755 /var/www/html/wordpress
              mv /var/www/html/wp-config-sample.php /var/www/html/wp-config.php
              sed -i 's/localhost/${Database.PublicConnectionString}/' /var/www/html/wp-config.php
              sed -i 's/username_here/${DBUser}/' /var/www/html/wp-config.php
              sed -i 's/password_here/${DBPassword}/' /var/www/html/wp-config.php
              sed -i 's/database_name_here/${DBName}/' /var/www/html/wp-config.php
              systemctl restart httpd
              echo "Step2: Install and Config WordPress" >> .ros.provision
            else
              echo "#########################"
              echo "# WordPress has been installed and configed"
              echo "#########################"
            fi
            ${WebServerConditionHandle.CurlCli} --data-binary '{"status": "SUCCESS"}'
      Type: RunShellScript
      Name:
        Ref: ALIYUN::StackId
    DependsOn:
      - WebServerConditionHandle
  Invocation:
    Type: ALIYUN::ECS::Invocation
    Properties:
      InstanceIds:
        - Fn::GetAtt:
            - WebServer
            - InstanceId
      CommandId:
        Ref: Command
Outputs:
  DBInstanceId:
    Description: The instance id of created database instance.
    Value:
      Fn::GetAtt:
        - Database
        - DBInstanceId
  InnerConnectionString:
    Description: DB instance connection url by Intranet.
    Value:
      Fn::GetAtt:
        - Database
        - InnerConnectionString
  InstanceId:
    Description: The instance id of WebServer instance.
    Value:
      Fn::GetAtt:
        - WebServer
        - InstanceId
  WordPressUrl:
    Description: Wordpress default address.
    Value:
      Fn::Sub:
        - 'http://${IP}'
        - IP:
            Fn::GetAtt:
              - WebServer
              - PublicIp
