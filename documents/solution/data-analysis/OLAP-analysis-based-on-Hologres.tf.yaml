ROSTemplateFormatVersion: '2015-09-01'
Transform: Aliyun::Terraform-v1.5
Metadata:
  ALIYUN::ROS::Interface:
    TemplateTags:
      - acs:technical-solution:data-analysis:基于Hologres轻量高性能OLAP分析-tech_solu_146
Workspace:
  variable.tf: |-
    # ------------------------------------------------------------------------------
    # 模块输入变量
    #
    # 本文件定义了该 Terraform 模块所有可配置的输入变量。
    # 每个变量都包含了详细的说明，以帮助用户正确配置模块。
    # ------------------------------------------------------------------------------

    # 指定资源创建的阿里云可用区，默认为cn-hangzhou-j
    variable "zone_id" {
      type        = string
      description = "选择可用区"
      default     = "cn-hangzhou-j"
    }

    # RDS实例的规格型号
    variable "dbinstance_class" {
      type        = string
      description = "RDS实例规格"
      default     = "mysql.n2.medium.2c"
    }

    # RDS数据库的账号名称
    variable "db_user_name" {
      type        = string
      default     = "workshop"
      nullable    = false
      description = "RDS数据库账号"
    }

    # RDS数据库的密码
    variable "db_password" {
      type        = string
      sensitive   = true
      description = "RDS数据库密码"
      default     = "workshop#2017"
    }

    # RDS数据库名称
    variable "data_base_name" {
      type        = string
      sensitive   = true
      description = "RDS数据库名称"
      default     = "github_events_share"
    }
  main.tf: |-
    # ------------------------------------------------------------------------------
    # 核心资源定义
    #
    # 本文件包含了模块的核心基础设施资源
    # 这里的代码负责根据输入变量来创建和配置所有云资源
    # ------------------------------------------------------------------------------

    # 配置阿里云提供商
    provider "alicloud" {
      region = "cn-hangzhou"
    }

    # 创建一个随机ID
    resource "random_id" "suffix" {
      byte_length = 8
    }

    # 定义本地变量
    locals {
      common_name = "olap-analysis-${random_id.suffix.id}"
    }

    # 创建专有网络VPC
    resource "alicloud_vpc" "vpc" {
      cidr_block = "192.168.0.0/16"
      vpc_name   = "${local.common_name}-vpc"
    }

    # 创建交换机VSwitch
    resource "alicloud_vswitch" "vswitch" {
      vpc_id       = alicloud_vpc.vpc.id
      cidr_block   = "192.168.0.0/24"
      zone_id      = var.zone_id
      vswitch_name = "${local.common_name}-vsw"
    }

    # 创建RDS实例
    resource "alicloud_db_instance" "rdsdbinstance" {
      zone_id                  = var.zone_id
      vpc_id                   = alicloud_vpc.vpc.id
      vswitch_id               = alicloud_vswitch.vswitch.id
      instance_type            = var.dbinstance_class
      instance_storage         = 50
      instance_name            = "olap-analysis-rds"
      engine                   = "MySQL"
      engine_version           = "8.0"
      category                 = "Basic"
      db_instance_storage_type = "cloud_essd"
      security_ips             = ["192.168.0.0/16"]
      released_keep_policy     = "None"
    }

    # 创建RDS账户
    resource "alicloud_rds_account" "account" {
      db_instance_id   = alicloud_db_instance.rdsdbinstance.id
      account_type     = "Super"
      account_password = var.db_password
      account_name     = var.db_user_name
    }

    # 创建数据库
    resource "alicloud_db_database" "db_base" {
      instance_id   = alicloud_db_instance.rdsdbinstance.id
      character_set = "utf8"
      name          = var.data_base_name
    }

    # 创建Hologram实例
    resource "alicloud_hologram_instance" "hologram" {
      instance_type = "Standard"
      zone_id       = var.zone_id
      payment_type  = "PayAsYouGo"
      pricing_cycle = "Hour"
      cpu           = 32
      instance_name = "${local.common_name}-hologram"

      # 配置内网端点
      endpoints {
        type = "Intranet"
      }

      # 配置VPC单通道端点
      endpoints {
        vpc_id     = alicloud_vpc.vpc.id
        vswitch_id = alicloud_vswitch.vswitch.id
        type       = "VPCSingleTunnel"
      }
      # 配置互联网端点
      endpoints {
        type = "Internet"
      }
    }
  output.tf: |-
    # ------------------------------------------------------------------------------
    # 模块输出值
    #
    # 本文件定义了模块执行成功后返回给调用方的值。
    # 这些输出可以被其他 Terraform 配置引用，或在 apply 命令结束后显示给用户。
    # ------------------------------------------------------------------------------

    # 输出 Hologram 实例 ID
    output "hologram_instance_id" {
      value       = alicloud_hologram_instance.hologram.id
      description = "Hologram 实例 ID"
    }

    # 输出专有网络实例 ID
    output "vpc_instance_id" {
      value       = alicloud_vpc.vpc.id
      description = "专有网络实例 ID"
    }

    # 输出交换机实例 ID
    output "vswitch_instance_id" {
      value       = alicloud_vswitch.vswitch.id
      description = "交换机实例 ID"
    }

    # 输出 RDS 实例 ID
    output "rds_instance_id" {
      value       = alicloud_db_instance.rdsdbinstance.id
      description = "RDS 实例 ID"
    }

    # 输出RDS实例的内网连接地址
    output "mysql_host" {
      value       = alicloud_db_instance.rdsdbinstance.connection_string
      description = "RDS 内网连接地址"
    }

    # 输出数据库账号
    output "db_username" {
      value       = var.db_user_name
      description = "RDS 数据库账号"
    }

    # 输出数据库密码
    output "db_password" {
      value       = var.db_password
      sensitive   = true
      description = "RDS 数据库密码"
    }

    # 输出RDS数据库名称
    output "data_base_name" {
      value       = var.data_base_name
      sensitive   = true
      description = "RDS 数据库名称"
    }
