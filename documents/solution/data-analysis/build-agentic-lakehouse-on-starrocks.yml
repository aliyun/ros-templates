Parameters:
  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区
    AssociationProperty: ALIYUN::ECS::ZoneId
    AssociationPropertyMetadata:
      RegionId: ${ALIYUN::Region}
  StarRocksVersion:
    Type: String
    Label:
      en: StarRocks Version
      zh-cn: StarRocks 版本
    Default: 3.5
  StarRocksInstanceName:
    Type: String
    Label:
      en: StarRocks Instance Name
      zh-cn: StarRocks 实例名称
    Default: SR_Agentic_Lakehouse
  DlfCatalogName:
    Type: String
    Label:
      en: DLF Catalog Name
      zh-cn: DLF Catalog 名称
    Default: emr_severless_spark
  DataWorksResourceGroupName:
    Type: String
    Label:
      en: DataWorks Resource Group Name
      zh-cn: DataWorks资源组名称
    Default: DataWorks_Resource
  SparkWorkspaceName:
    Type: String
    Label:
      en: Spark Workspace Name
      zh-cn: E-MapReduce Serverless Spark工作空间名称
    Default: Serverless_Spark_Workspace
  SparkCu:
    Type: String
    Label:
      en: Spark Cu
      zh-cn: E-MapReduce Serverless Spark CU 瞬时配额上限
    Default: 300
  DsOSSBucketName:
    Type: String
    Label:
      en: New DataWorks BucketName
      zh-cn: 用于多模态数据图片的存储 Bucket 名称
    Description:
      en: Bucket names must be globally unique within the scope of OSS. The length
        is 3~63 characters. Must start and end with a lowercase English letter or
        number, and can contain lowercase English letters, numbers, and dashes (-).
      zh-cn: Bucket 名称在 OSS 范围内必须全局唯一。长度为3~63个字符。必须以小写英文字母或数字开头和结尾，可包含小写英文字母、数字和短划线（-）。
    AssociationProperty: AutoCompleteInput
    AssociationPropertyMetadata:
      Length: 3
      Prefix: dataset-agentic-lakehouse-
      CharacterClasses:
        - Class: number
          min: 3
    AllowedPattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
  SparkOSSBucketName:
    Type: String
    Label:
      en: New Spark BucketName
      zh-cn: 用于E-MapReduce Serverless Spark 的工作空间基础路径 Bucket 名称
    Description:
      en: Bucket names must be globally unique within the scope of OSS. The length
        is 3~63 characters. Must start and end with a lowercase English letter or
        number, and can contain lowercase English letters, numbers, and dashes (-).
      zh-cn: Bucket 名称在 OSS 范围内必须全局唯一。长度为3~63个字符。必须以小写英文字母或数字开头和结尾，可包含小写英文字母、数字和短划线（-）。
    AssociationProperty: AutoCompleteInput
    AssociationPropertyMetadata:
      Length: 3
      Prefix: emr-spark-
      CharacterClasses:
        - Class: number
          min: 3
    AllowedPattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
  DWWorkspaceName:
    Label:
      zh-cn: DataWorks工作空间名称。
      en: The name of the DataWorks.
    Default: DW_Agentic_Lakehouse
    Type: String
  RamUserName:
    Type: String
    Label:
      zh-cn: RAM 账号名称
      en: RAM Account Name
    Description:
      zh-cn: 用户名， [1, 64]英文或中文字符，必须以字母，可以包含数字、下划线或“.”、“-”。
      en: The name of sub account, [1, 64]Consist of lowercase letter, number, '@',
        '.', '_' or '-'.
    Default: dlf-test
  FrontendResidentNodeNumber:
    Type: Number
    Label:
      en: FE ResidentNodeNumber
      zh-cn: FE 节点数量
    Default: 1
    Description: FE 每个节点默认配置 8CU 数量（1 CU = 1 核 CPU + 4 GiB 内存）
  BackendResidentNodeNumber:
    Type: Number
    Label:
      en: CN ResidentNodeNumber
      zh-cn: CN 节点数量
    Default: 1
    Description: CN 每个节点默认配置 8CU 数量（1 CU = 1 核 CPU + 4 GiB 内存）
  AdminPassword:
    Type: String
    Label:
      en: Admin Password
      zh-cn: 管理员密码
    NoEcho: true
    AssociationProperty: ALIYUN::ECS::Instance::Password
    Description: StarRocks 管理员密码，8~30 个字符，需包含大小写字母、数字和特殊字符
Resources:
  Vpc:
    Type: ALIYUN::ECS::VPC
    Properties:
      VpcName: VPC_HZ
      CidrBlock: 192.168.0.0/16
  VSwitch:
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VpcId: !Ref Vpc
      ZoneId: !Ref ZoneId
      VSwitchName: vsw_001
      CidrBlock: 192.168.1.0/24
  DatasetBucket:
    Type: ALIYUN::OSS::Bucket
    Properties:
      BucketName: !Ref DsOSSBucketName
      StorageClass: Standard
      RedundancyType: ZRS
      AccessControl: private
  SparkBucket:
    Type: ALIYUN::OSS::Bucket
    Properties:
      BucketName: !Ref SparkOSSBucketName
      StorageClass: Standard
      RedundancyType: ZRS
      AccessControl: private
  DlfCatalog:
    Type: ALIYUN::DataLakeFormation::Catalog
    Properties:
      Name: !Ref DlfCatalogName
      Options:
        StorageType: Standard
        DataRedundancyType: LRS
  DlfVpcConfig:
    Type: ALIYUN::DataLakeFormation::VpcConfig
    DependsOn: DlfCatalog
    Properties:
      VpcId: !Ref Vpc
  RamUser:
    Type: ALIYUN::RAM::User
    Properties:
      UserName: !Ref RamUserName
      DisplayName: !Ref RamUserName
      PolicyAttachments:
        System:
          - AliyunDLFFullAccess
          - AliyunEMRFullAccess
          - AliyunEMRStarRocksFullAccess
  StarRocksInstance:
    Type: ALIYUN::EMR::StarRocksInstance
    DependsOn:
      - Vpc
      - VSwitch
    Properties:
      InstanceName: !Ref StarRocksInstanceName
      PayType: PostPaid
      RunMode: shared_data
      PackageType: official
      Version: !Ref StarRocksVersion
      ClusterZoneId: !Ref ZoneId
      VpcId: !GetAtt Vpc.VpcId
      Vswitches:
        - ZoneId: !Ref ZoneId
          VSwitchId: !GetAtt VSwitch.VSwitchId
      FrontendNodeGroups:
        - SpecType: standard
          StoragePerformanceLevel: pl1
          StorageSize: 100
          ResidentNodeNumber: !Ref FrontendResidentNodeNumber
          Cu: 8
      BackendNodeGroups:
        - SpecType: standard
          StoragePerformanceLevel: pl1
          DiskNumber: 1
          StorageSize: 200
          ResidentNodeNumber: !Ref BackendResidentNodeNumber
          Cu: 8
      AdminPassword: !Ref AdminPassword
      OssAccessingRoleName: AliyunEMRStarRocksAccessingOSSRole
  EnableDataWorks:
    Type: ALIYUN::ROS::AutoEnableService
    Properties:
      ServiceName: DataWorks
  DataWorksProject:
    Type: ALIYUN::DataWorks::Project
    DependsOn: EnableDataWorks
    Properties:
      ProjectIdentifier: !Ref DWWorkspaceName
      ProjectName: !Ref DWWorkspaceName
      ProjectMode: 2
  DataWorksResourceGroup:
    Type: ALIYUN::DataWorks::ResourceGroup
    DependsOn: EnableDataWorks
    Properties:
      Name: !Ref DataWorksResourceGroupName
      PaymentType: PostPaid
      VpcId: !GetAtt Vpc.VpcId
      VSwitchId: !GetAtt VSwitch.VSwitchId
  DataWorksResourceGroupBinding:
    Type: ALIYUN::DataWorks::ResourceGroupRelation
    DependsOn:
      - DataWorksProject
      - DataWorksResourceGroup
    Properties:
      ProjectId: !GetAtt DataWorksProject.Id
      ResourceGroupId: !GetAtt DataWorksResourceGroup.Id
  SparkWorkspace:
    Type: ALIYUN::EMR::SparkWorkspace
    Properties:
      WorkspaceName: !Ref SparkWorkspaceName
      ResourceSpec:
        Cu: !Ref SparkCu
      OssBucket:
        Fn::Sub: oss://${SparkOSSBucketName}/
      DlfCatalogId: !GetAtt DlfCatalog.CatalogId
      PaymentType: PostPaid
      RamRoleName: AliyunEMRSparkJobRunDefaultRole
Outputs:
  AdminPassword:
    Description:
      zh-cn: 用户admin 的自定义密码
    Value: !Ref AdminPassword
    NoEcho: true
  SparkWorkspaceName:
    Value: !Ref SparkWorkspaceName
    Description:
      zh-cn: E-MapReduce Spark 的工作空间名称
  DatasetBucketName:
    Value: !GetAtt DatasetBucket.Name
    Description:
      zh-cn: 用于多模态数据图片的存储 Bucket 名称
  SparkBucketName:
    Value: !GetAtt SparkBucket.Name
    Description:
      zh-cn: 用于E-MapReduce Serverless Spark 的工作空间基础路径 Bucket 名称
  DlfCatalogName:
    Value: !GetAtt DlfCatalog.Name
    Description:
      zh-cn: DLF Catalog 名称
  StarRocksInstanceName:
    Value: !GetAtt StarRocksInstance.InstanceName
    Description:
      zh-cn: StarRocks 实例名称
  DataWorksProjectName:
    Value: !GetAtt DataWorksProject.ProjectIdentifier
    Description:
      zh-cn: DataWorks 项目空间名称
