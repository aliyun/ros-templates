ROSTemplateFormatVersion: '2015-09-01'
Description:
  zh-cn: 在CentOS 7 ECS实例上自动部署WordPress，包括配置Nginx、MySQL、PHP及安全设置，提供公网访问URL。
  en: Automatically deploy WordPress on a CentOS 7 ECS instance, encompassing the
    configuration of Nginx, MySQL, PHP, and implementing security settings, with provision
    for public internet access via a URL.
Conditions:
  CreateInstance:
    'Fn::Equals':
      - Ref: SelectInstance
      - false
Parameters:
  SelectInstance:
    Type: Boolean
    Label:
      en: Whether to select an existing instance
      zh-cn: 是否选择已有实例
    Description:
      en: >-
        Whether to select an existing Centos7 system instance. The Centos7
        system instance must be connected to a public network.
      zh-cn: 是否选择已有Centos7系统实例，实例需要开通公网。
    Default: true
  InstanceId:
    Type: String
    Label:
      en: Existing ECS Instance
      zh-cn: 已创建ECS实例
    Description:
      en: Select an ECS instance with the CentOS 7.9 64-bit operating system.
      zh-cn: 选择已存在操作系统为CentOS 7.9 64位的ECS实例。
    AssociationProperty: 'ALIYUN::ECS::Instance::InstanceId'
    AssociationPropertyMetadata:
      Visible:
        Condition:
          'Fn::Equals':
            - '${SelectInstance}'
            - true
    Default: null
  ZoneId:
    Type: String
    Label:
      en: VSwitch Availability Zone
      zh-cn: 可用区ID
    Description:
      en: >-
        Availability Zone ID,<br><b>note： <font color='blue'>Before selecting,
        please confirm that the Availability Zone supports the specification of
        creating ECS resources.</font></b>
      zh-cn: >-
        可用区ID。<br><b>注： <font
        color='blue'>选择可用区前请确认该可用区是否支持创建ECS资源的规格。</font></b>
    AssociationProperty: 'ALIYUN::ECS::Instance:ZoneId'
    AssociationPropertyMetadata:
      ZoneId: ZoneId
      Visible:
        Condition:
          'Fn::Equals':
            - '${SelectInstance}'
            - false
    Default: null
  InstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    Description:
      en: >-
        Fill in the specifications that can be used under the VSwitch
        availability zone;</b></font><br>general specifications：<font
        color='red'><b>ecs.c5.large</b></font><br>note: a few zones do not
        support general specifications<br>see detail: <a
        href='https://www.alibabacloud.com/help/en/doc-detail/25378.html'
        target='_blank'><b><font color='blue'>Instance Specification
        Family</font></a></b>
      zh-cn: >-
        填写VSwitch可用区下可使用的规格；<br>通用规格：<font
        color='red'><b>ecs.c5.large</b></font><br>注：可用区可能不支持通用规格<br>规格详见：<a
        href='https://help.aliyun.com/document_detail/25378.html'
        target='_blank'><b><font color='blue'>实例规格族</font></a></b>
    AssociationProperty: 'ALIYUN::ECS::Instance::InstanceType'
    AssociationPropertyMetadata:
      ZoneId: ZoneId
      Visible:
        Condition:
          'Fn::Equals':
            - '${SelectInstance}'
            - false
    Default: ecs.c5.large
  SystemDiskCategory:
    Type: String
    Label:
      en: System Disk Type
      zh-cn: 系统盘类型
    Description:
      en: >-
        <font color='blue'><b>Optional values:</b></font><br>[cloud_efficiency:
        <font color='green'>Efficient Cloud Disk</font>]<br>[cloud_ssd: <font
        color='green'>SSD Cloud Disk</font>]<br>[cloud_essd: <font
        color='green'>ESSD Cloud Disk</font>]<br>[cloud: <font
        color='green'>Cloud Disk</font>]<br>[ephemeral_ssd: <font
        color='green'>Local SSD Cloud Disk</font>]
      zh-cn: >-
        <font color='blue'><b>可选值：</b></font><br>[cloud_efficiency: <font
        color='green'>高效云盘</font>]<br>[cloud_ssd: <font
        color='green'>SSD云盘</font>]<br>[cloud_essd: <font
        color='green'>ESSD云盘</font>]<br>[cloud: <font
        color='green'>普通云盘</font>]<br>[ephemeral_ssd: <font
        color='green'>本地SSD盘</font>]
    AssociationProperty: 'ALIYUN::ECS::Disk::SystemDiskCategory'
    AssociationPropertyMetadata:
      LocaleKey: DiskCategory
      InstanceType: '${InstanceType}'
      ZoneId: ZoneId
      Visible:
        Condition:
          'Fn::Equals':
            - '${SelectInstance}'
            - false
    Default: cloud_efficiency
  InstancePassword:
    Type: String
    Label:
      en: Instance Password
      zh-cn: 实例密码
    Description:
      en: >-
        Server login password, Length 8-30, must contain three(Capital letters,
        lowercase letters, numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special
        symbol in).
      zh-cn: >-
        服务器登录密码,长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/
        中的特殊符号）。
    ConstraintDescription:
      en: >-
        Length 8-30, must contain three(Capital letters, lowercase letters,
        numbers, ()`~!@#$%^&*_-+=|{}[]:;'<>,.?/ Special symbol in).
      zh-cn: '长度8-30，必须包含三项（大写字母、小写字母、数字、 ()`~!@#$%^&*_-+=|{}[]:;''<>,.?/ 中的特殊符号）。'
    AssociationProperty: ALIYUN::ECS::Instance::Password
    AssociationPropertyMetadata:
      Visible:
        Condition:
          'Fn::Equals':
            - '${SelectInstance}'
            - false
    MinLength: 8
    MaxLength: 30
    NoEcho: true
    Default: null
  DbPassword:
    Type: String
    Label:
      en: The MySQL user password, consisting of letters, numbers, and underscores (_), 8 to 32 characters in length.
      zh-cn: 数据库用户密码
    Description:
      en: >-
        The MySQL user password, consisting of letters, numbers, and
        underline(_), 8 to 32 characters in length.
      zh-cn: MySQL用户密码，数据库访问大小写字母、数字和下划线（_），8-32个字符。
    ConstraintDescription:
      en: >-
        Consisting of letters, numbers, and underline(_), 8 to 32 characters in
        length.
      zh-cn: 由字母、数字和下划线(_)组成，长度为8到32个字符。
    MinLength: 8
    MaxLength: 32
    NoEcho: true
    AssociationProperty: ALIYUN::ECS::Instance::Password
Resources:
  Vpc:
    Type: 'ALIYUN::ECS::VPC'
    Condition: CreateInstance
    Properties:
      CidrBlock: 192.168.0.0/16
  VSwitch:
    Type: 'ALIYUN::ECS::VSwitch'
    Condition: CreateInstance
    Properties:
      ZoneId:
        Ref: ZoneId
      VpcId:
        Ref: Vpc
      CidrBlock: 192.168.0.0/24
  SecurityGroup:
    Type: 'ALIYUN::ECS::SecurityGroup'
    Condition: CreateInstance
    Properties:
      VpcId:
        Ref: Vpc
  SecurityGroupIngress_80:
    Type: 'ALIYUN::ECS::SecurityGroupIngress'
    Properties:
      SecurityGroupId:
        'Fn::Jq':
          - First
          - '.[0].SecurityGroupIds[0]'
          - 'Fn::GetAtt':
              - DS_Instances
              - Instances
      SourceCidrIp: 0.0.0.0/0
      IpProtocol: tcp
      NicType: intranet
      PortRange: 80/80
  SecurityGroupIngress_443:
    Type: 'ALIYUN::ECS::SecurityGroupIngress'
    Properties:
      SecurityGroupId:
        'Fn::Jq':
          - First
          - '.[0].SecurityGroupIds[0]'
          - 'Fn::GetAtt':
              - DS_Instances
              - Instances
      SourceCidrIp: 0.0.0.0/0
      IpProtocol: tcp
      NicType: intranet
      PortRange: 443/443
  WaitConditionHandle:
    Type: 'ALIYUN::ROS::WaitConditionHandle'
    Properties: {}
  RosWaitCondition:
    Type: 'ALIYUN::ROS::WaitCondition'
    Properties:
      Count: 1
      Handle:
        Ref: WaitConditionHandle
      Timeout: 7200
  DS_Instances:
    Type: 'DATASOURCE::ECS::Instances'
    Properties:
      InstanceIds:
        'Fn::If':
          - CreateInstance
          - 'Fn::GetAtt':
              - InstanceGroup
              - InstanceIds
          - - Ref: InstanceId
  InstanceGroup:
    Type: 'ALIYUN::ECS::InstanceGroup'
    Condition: CreateInstance
    Properties:
      VpcId:
        Ref: Vpc
      VSwitchId:
        Ref: VSwitch
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId: centos_7_8
      InstanceType:
        Ref: InstanceType
      SystemDiskCategory:
        Ref: SystemDiskCategory
      Password:
        Ref: InstancePassword
      IoOptimized: optimized
      MaxAmount: 1
  InstallWordpress:
    Type: 'ALIYUN::ECS::RunCommand'
    Properties:
      InstanceIds:
        'Fn::If':
          - CreateInstance
          - 'Fn::GetAtt':
              - InstanceGroup
              - InstanceIds
          - - Ref: InstanceId
      Type: RunShellScript
      Sync: true
      Timeout: 7200
      CommandContent:
        'Fn::Sub':
          - >-
            #!/bin/bash

            if [ ! -f .ros.provision ]; then
              echo "Name: 手动搭建WordPress（CentOS 7）" > .ros.provision
            fi


            name=$(grep "^Name:" .ros.provision | awk -F':' '{print $2}' | sed
            -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')

            if [[ "$name" != "手动搭建WordPress（CentOS 7）" ]]; then
              echo "当前实例已使用过\"$name\"教程的一键配置，不能再使用本教程的一键配置"
              ${WaitConditionHandle.CurlCli} --data-binary "{\"status\": \"FAILURE\", \"reason\": \"The current instance has already applied the configuration of the \\\"$name\\\" tutorial, and the configuration of this tutorial can no longer be applied.\"}"
              exit 0
            fi


            echo "#########################"

            echo "# Check Network"

            echo "#########################"

            ping -c 2 -W 2 aliyun.com > /dev/null

            if [[ $? -ne 0 ]]; then
              echo "当前实例无法访问公网"
              ${WaitConditionHandle.CurlCli} --data-binary "{\"status\": \"FAILURE\", \"reason\": \"The current instance cannot access the public network.\"}"
              exit 0
            fi


            if ! grep -q "^Step1: Prepare Environment$" .ros.provision; then
              echo "#########################"
              echo "# Prepare Environment"
              echo "#########################"
              systemctl status firewalld
              systemctl stop firewalld
              echo "Step1: Prepare Environment" >> .ros.provision
            else
              echo "#########################"
              echo "# Environment has been ready"
              echo "#########################"
            fi


            if ! grep -q "^Step2: Install Nginx$" .ros.provision; then
              echo "#########################"
              echo "# Install Nginx"
              echo "#########################"
              yum -y install nginx
              nginx -v
              echo "Step2: Install Nginx" >> .ros.provision
            else
              echo "#########################"
              echo "# Nginx has been installed"
              echo "#########################"
            fi


            if ! grep -q "^Step3: Install MySQL$" .ros.provision; then
              echo "#########################"
              echo "# Install MySQL"
              echo "#########################"
              rpm -Uvh  https://dev.mysql.com/get/mysql57-community-release-el7-9.noarch.rpm
              yum -y install mysql-community-server --nogpgcheck
              mysql -V
              systemctl start mysqld
              systemctl enable mysqld
              systemctl daemon-reload
              echo "Step3: Install MySQL" >> .ros.provision
            else
              echo "#########################"
              echo "# MySQL has been installed"
              echo "#########################"
            fi


            if ! grep -q "^Step4: Install PHP$" .ros.provision; then
              echo "#########################"
              echo "# Install PHP"
              echo "#########################"
              sh -eu <<'ROS_PHP_BUILD'
            PHP_BUILD_DIR=$(mktemp -d /tmp/ros-php.XXXXXX)

            cd "$PHP_BUILD_DIR"

            # 归档仓库仅用于本次 PHP 编译依赖，不改系统全局仓库配置。

            cat > yum.conf <<'ROS_PHP_YUM'

            [main]

            reposdir=/dev/null

            gpgcheck=1

            [ros-php-base]

            name=CentOS 7 PHP build dependencies

            baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/os/$basearch/

            gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7

            [ros-php-updates]

            name=CentOS 7 PHP build dependency updates

            baseurl=https://mirrors.aliyun.com/centos-vault/7.9.2009/updates/$basearch/

            gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7

            [ros-php-epel-archive]

            name=EPEL 7 archive PHP build dependencies

            baseurl=https://mirrors.aliyun.com/epel-archive/7/$basearch/

            gpgkey=https://mirrors.aliyun.com/epel/RPM-GPG-KEY-EPEL-7

            ROS_PHP_YUM

            # 构建依赖对应原 gd、ldap、mbstring、mcrypt 与两个 PECL 扩展的编译需要。

            yum -c "$PHP_BUILD_DIR/yum.conf" install -y gcc gcc-c++ make pkgconfig curl xz libxml2-devel sqlite-devel zlib-devel perl-core libpng-devel libjpeg-turbo-devel freetype-devel openldap-devel oniguruma-devel libmcrypt-devel autoconf

            # PHP 使用独立的受维护 OpenSSL，避免旧系统库的 API 兼容问题。

            OPENSSL_PREFIX=/opt/ros/php/openssl-3.5.9

            # 镜像仅提供传输备选，每次下载均须通过同一官方 SHA256 校验。

            OPENSSL_DOWNLOADED=0

            for OPENSSL_URL in \
                https://gh-proxy.com/https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz \
                https://dev-www.libreoffice.org/src/openssl-3.5.9.tar.gz \
                https://sources.immortalwrt.org/openssl-3.5.9.tar.gz \
                https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz; do
                if curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 15 --max-time 1800 -o openssl.tar.gz "$OPENSSL_URL" &&
                    printf '%s\n' '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl.tar.gz' | sha256sum -c -; then
                    OPENSSL_DOWNLOADED=1
                    break
                fi
            done

            [ "$OPENSSL_DOWNLOADED" -eq 1 ] || exit 1

            tar -xzf openssl.tar.gz

            cd openssl-3.5.9

            ./config --prefix="$OPENSSL_PREFIX" --libdir=lib --openssldir=/etc/pki/tls shared

            make -j2

            make install_sw

            cd "$PHP_BUILD_DIR"

            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 1200 -o php.tar.xz https://www.php.net/distributions/php-8.3.36.tar.xz

            printf '%s\n' 'dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd  php.tar.xz' | sha256sum -c -

            tar -xJf php.tar.xz

            cd php-8.3.36

            PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$OPENSSL_PREFIX/lib" ./configure --prefix=/opt/ros/php/8.3.36 --with-config-file-path=/opt/ros/php/8.3.36/etc --with-config-file-scan-dir=/opt/ros/php/8.3.36/etc/php.d --enable-fpm --with-fpm-user=nginx --with-fpm-group=nginx --with-openssl --with-zlib --enable-mysqlnd --with-mysqli=mysqlnd --with-pdo-mysql=mysqlnd --enable-gd --with-jpeg --with-freetype --with-libdir=lib64 --with-ldap --enable-mbstring --enable-opcache

            make -j2

            make install

            mkdir -p /opt/ros/php/8.3.36/etc/php.d

            cp php.ini-production /opt/ros/php/8.3.36/etc/php.ini

            ln -sf /opt/ros/php/8.3.36/bin/php /usr/bin/php

            printf '%s\n' 'zend_extension=opcache.so' > /opt/ros/php/8.3.36/etc/php.d/opcache.ini

            # 池配置沿用原 RPM 的 TCP 监听地址，Nginx 的 fastcgi_pass 保持不变。

            cp /opt/ros/php/8.3.36/etc/php-fpm.conf.default /opt/ros/php/8.3.36/etc/php-fpm.conf

            cp /opt/ros/php/8.3.36/etc/php-fpm.d/www.conf.default /opt/ros/php/8.3.36/etc/php-fpm.d/www.conf

            sed -i 's|^listen = .*|listen = 127.0.0.1:9000|' /opt/ros/php/8.3.36/etc/php-fpm.d/www.conf

            grep -q '^listen = 127\.0\.0\.1:9000$' /opt/ros/php/8.3.36/etc/php-fpm.d/www.conf

            cat > /etc/systemd/system/php-fpm.service <<'ROS_PHP_FPM_UNIT'

            [Unit]

            Description=The PHP FastCGI Process Manager

            After=syslog.target network.target

            [Service]

            Type=simple

            ExecStart=/opt/ros/php/8.3.36/sbin/php-fpm --nodaemonize --fpm-config /opt/ros/php/8.3.36/etc/php-fpm.conf

            ExecReload=/bin/kill -USR2 $MAINPID

            PrivateTmp=true

            [Install]

            WantedBy=multi-user.target

            ROS_PHP_FPM_UNIT

            systemctl daemon-reload

            cd "$PHP_BUILD_DIR"

            # 原 mcrypt、redis、mongodb 三个扩展在 PHP 8 均需 PECL 源码构建，逐个固定版本与哈希。

            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o mcrypt.tgz https://pecl.php.net/get/mcrypt-1.0.9.tgz

            printf '%s\n' '2a9ef0817d3bf677f6d7baf8e325629a2758974735d8abad6566384788d424a5  mcrypt.tgz' | sha256sum -c -

            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 600 -o redis.tgz https://pecl.php.net/get/redis-6.2.0.tgz

            printf '%s\n' '5069c13dd22bd9e494bb246891052cb6cc0fc9a1b45c6a572a8be61773101363  redis.tgz' | sha256sum -c -

            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --retry 0 --connect-timeout 30 --max-time 900 -o mongodb.tgz https://pecl.php.net/get/mongodb-2.5.5.tgz

            printf '%s\n' '0eaf84ff709f73183d80597f31ff02937f6aefde01eb895a0aa19334a290cec0  mongodb.tgz' | sha256sum -c -

            tar -xzf mcrypt.tgz

            tar -xzf redis.tgz

            tar -xzf mongodb.tgz

            for PHP_PECL_BUILD in mcrypt-1.0.9 redis-6.2.0 mongodb-2.5.5; do
                cd "$PHP_BUILD_DIR/$PHP_PECL_BUILD"
                /opt/ros/php/8.3.36/bin/phpize
                if [ "$PHP_PECL_BUILD" = mongodb-2.5.5 ]; then
                    PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$OPENSSL_PREFIX/lib" ./configure --with-php-config=/opt/ros/php/8.3.36/bin/php-config --with-mongodb-ssl=openssl --with-mongodb-sasl=no
                else
                    PKG_CONFIG_PATH="$OPENSSL_PREFIX/lib/pkgconfig" LDFLAGS="-Wl,-rpath,$OPENSSL_PREFIX/lib" ./configure --with-php-config=/opt/ros/php/8.3.36/bin/php-config
                fi
                make -j2
                make install
            done

            printf '%s\n' 'extension=mcrypt.so' > /opt/ros/php/8.3.36/etc/php.d/mcrypt.ini

            printf '%s\n' 'extension=redis.so' > /opt/ros/php/8.3.36/etc/php.d/redis.ini

            printf '%s\n' 'extension=mongodb.so' > /opt/ros/php/8.3.36/etc/php.d/mongodb.ini

            php -r 'exit(PHP_VERSION === "8.3.36" ? 0 : 1);'

            php -i | grep -q '^OpenSSL Library Version => OpenSSL 3\.5\.9 '

            php -v | grep -q 'Zend OPcache'

            # 原扩展清单逐项核对实际加载状态；pdo_mysql 由 mysqlnd 提供，与原模板一致。

            for PHP_EXTENSION in gd ldap mbstring mcrypt mysqli pdo pdo_mysql redis mongodb openssl; do
                php -r 'exit(extension_loaded($argv[1]) ? 0 : 1);' "$PHP_EXTENSION"
            done

            /opt/ros/php/8.3.36/sbin/php-fpm -t -y /opt/ros/php/8.3.36/etc/php-fpm.conf

            ROS_PHP_BUILD
              [ "$?" -eq 0 ] || exit 1
              php -v
              echo "Step4: Install PHP" >> .ros.provision
            else
              echo "#########################"
              echo "# PHP has been installed"
              echo "#########################"
            fi


            if ! grep -q "^Step4: Config Nginx$" .ros.provision; then
              echo "#########################"
              echo "# Config Nginx"
              echo "#########################"
              cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak
              cat > /etc/nginx/nginx.conf << \EOF
            # For more information on configuration, see:

            #   * Official English Documentation: http://nginx.org/en/docs/

            #   * Official Russian Documentation: http://nginx.org/ru/docs/


            user nginx;

            worker_processes auto;

            error_log /var/log/nginx/error.log;

            pid /run/nginx.pid;


            # Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.

            include /usr/share/nginx/modules/*.conf;


            events {
                worker_connections 1024;
            }


            http {
                log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                                  '$status $body_bytes_sent "$http_referer" '
                                  '"$http_user_agent" "$http_x_forwarded_for"';

                access_log  /var/log/nginx/access.log  main;

                sendfile            on;
                tcp_nopush          on;
                tcp_nodelay         on;
                keepalive_timeout   65;
                types_hash_max_size 4096;

                include             /etc/nginx/mime.types;
                default_type        application/octet-stream;

                # Load modular configuration files from the /etc/nginx/conf.d directory.
                # See http://nginx.org/en/docs/ngx_core_module.html#include
                # for more information.
                include /etc/nginx/conf.d/*.conf;

                server {
                    listen       80;
                    listen       [::]:80;
                    server_name  _;
                    root         /usr/share/nginx/html/wordpress;

                    # Load configuration files for the default server block.
                    include /etc/nginx/default.d/*.conf;

                    location / {
                        index index.php index.html index.htm;
                    }

                    location ~ .php$ {
                        root /usr/share/nginx/html/wordpress;    # 将/usr/share/nginx/html替换为您的网站根目录，本文使用/usr/share/nginx/html作为网站根目录。
                        fastcgi_pass 127.0.0.1:9000;   # Nginx通过本机的9000端口将PHP请求转发给PHP-FPM进行处理。
                        fastcgi_index index.php;
                        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                        include fastcgi_params;   # Nginx调用fastcgi接口处理PHP请求。
                    }

                    error_page 404 /404.html;
                    location = /404.html {
                    }

                    error_page 500 502 503 504 /50x.html;
                    location = /50x.html {
                    }
                }

            # Settings for a TLS enabled server.

            #

            #    server {

            #        listen       443 ssl http2;

            #        listen       [::]:443 ssl http2;

            #        server_name  _;

            #        root         /usr/share/nginx/html;

            #

            #        ssl_certificate "/etc/pki/nginx/server.crt";

            #        ssl_certificate_key "/etc/pki/nginx/private/server.key";

