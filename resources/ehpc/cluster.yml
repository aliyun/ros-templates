ROSTemplateFormatVersion: '2015-09-01'
Description:
  zh-cn: 创建EHPC 2.0集群，含NAS文件系统、OSS存储桶，配置访问规则与挂载目标作为集群共享存储，支持管理节点实例类型与镜像定制。
  en: Create an EHPC 2.0 (Elastic High Performance Computing) cluster, inclusive of a
    NAS (Network Attached Storage) file system and OSS (Object Storage Service) buckets.
    Configure access rules and mount targets as the cluster shared storage, with support
    for customized manager node instance type and image.
Parameters:
  BucketStorageClass:
    Type: String
    Default: Standard
  VpcId:
    Type: String
  VSwitchId:
    Type: String
  AccessGroupName:
    Type: String
  ClusterName:
    Type: String
    Default: mytest
  EcsOrderLoginInstanceType:
    Type: String
    Description: Instance type of the manager node.
    Default: ecs.g6.large
  ImageId:
    Type: String
    Description: Image of the manager node, must be an OS supported by E-HPC 2.0.
  BucketName:
    Type: String
    Default: mytest
  ZoneId:
    Type: String
  BucketAccessControl:
    Type: String
    Default: public-read
  Password:
    Type: String
Resources:
  AccessGroup:
    Type: ALIYUN::NAS::AccessGroup
    Properties:
      AccessGroupType: Vpc
      AccessGroupName:
        Ref: AccessGroupName
  FileSystem:
    Type: ALIYUN::NAS::FileSystem
    Properties:
      StorageType: Capacity
      ProtocolType: NFS
  OssBucket:
    Type: ALIYUN::OSS::Bucket
    Properties:
      BucketName:
        Ref: BucketName
      StorageClass:
        Ref: BucketStorageClass
      AccessControl:
        Ref: BucketAccessControl
  MountTarget:
    Type: ALIYUN::NAS::MountTarget
    Properties:
      VpcId:
        Ref: VpcId
      VSwitchId:
        Ref: VSwitchId
      NetworkType: Vpc
      AccessGroupName:
        Ref: AccessGroup
      FileSystemId:
        Ref: FileSystem
  AccessRule:
    Type: ALIYUN::NAS::AccessRule
    Properties:
      SourceCidrIp: 0.0.0.0/0
      AccessGroupName:
        Ref: AccessGroup
  Cluster:
    Type: ALIYUN::EHPC::ClusterV2
    Properties:
      ClusterName:
        Ref: ClusterName
      ClusterCategory: Standard
      ClusterMode: Integrated
      VpcId:
        Ref: VpcId
      VSwitchId:
        Ref: VSwitchId
      ClusterCredentials:
        Password:
          Ref: Password
      Manager:
        ManagerNode:
          InstanceType:
            Ref: EcsOrderLoginInstanceType
          ImageId:
            Ref: ImageId
          InstanceChargeType: PostPaid
          SystemDisk:
            Category: cloud_essd
            Size: 40
            Level: PL0
        Scheduler:
          Type: SLURM
          Version: 22.05.8
        DNS:
          Type: NIS
          Version: '1.0'
        DirectoryService:
          Type: NIS
          Version: '1.0'
      # E-HPC 2.0 标准版集群需同时挂载 /home、/opt、/ehpcdata 共享目录
      SharedStorages:
      - FileSystemId:
          Ref: FileSystem
        MountTargetDomain:
          Fn::GetAtt:
          - MountTarget
          - MountTargetDomain
        MountDirectory: /home
        NASDirectory: /
        ProtocolType: NFS
        MountOptions: -t nfs -o vers=3,nolock,proto=tcp,noresvport
      - FileSystemId:
          Ref: FileSystem
        MountTargetDomain:
          Fn::GetAtt:
          - MountTarget
          - MountTargetDomain
        MountDirectory: /opt
        NASDirectory: /
        ProtocolType: NFS
        MountOptions: -t nfs -o vers=3,nolock,proto=tcp,noresvport
      - FileSystemId:
          Ref: FileSystem
        MountTargetDomain:
          Fn::GetAtt:
          - MountTarget
          - MountTargetDomain
        MountDirectory: /ehpcdata
        NASDirectory: /
        ProtocolType: NFS
        MountOptions: -t nfs -o vers=3,nolock,proto=tcp,noresvport
    DependsOn:
    - AccessRule
    - FileSystem
    - MountTarget
Outputs:
  MountTargetDomain:
    Description: Mount point domain name
    Value:
      Fn::GetAtt:
      - MountTarget
      - MountTargetDomain
  FileSystemId:
    Description: ID of the file system created
    Value:
      Fn::GetAtt:
      - FileSystem
      - FileSystemId
  ClusterId:
    Description: ID of the E-HPC cluster
    Value:
      Fn::GetAtt:
      - Cluster
      - ClusterId
