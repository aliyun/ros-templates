ROSTemplateFormatVersion: '2015-09-01'
Description:
  zh-cn: 在已有的交换机和安全组中创建一个ECI容器组，支持日志收集，配置容器镜像、CPU、内存和端口映射。
  en: Create an ECI (Elastic Container Instance) container group in an existing VSwitch
    and security group, with support for log collection. Configure the container with
    image specifications, CPU allocation, memory limits, and port mappings.
Parameters:
  ContainerName:
    Type: String
    Description: The name of the Container.
    Default: mytest
  ContainerImage:
    Type: String
    Description: The name of the Image.
    Default: busybox
  ContainerGroupName:
    Type: String
    Description: The name of the ContainerGroup.
    Default: mytest
  RestartPolicy:
    Type: String
    Description: 'The policy for restarting the instance. Default value: Always.'
    Default: Always
    AllowedValues:
    - Always
    - OnFailure
    - Never
  VSwitchId:
    Type: String
    Description: The ID of the existing VSwitch.
  SecurityGroupId:
    Type: String
    Description: The ID of the existing security group, which must belong to the VPC of the VSwitch.
  SlsEnable:
    Type: Boolean
    Description: Enable user log collection. The default is false.
    Default: false
    AllowedValues:
    - 'true'
    - 'false'
Resources:
  ContainerGroup:
    Type: ALIYUN::ECI::ContainerGroup
    Properties:
      VSwitchId:
        Ref: VSwitchId
      SecurityGroupId:
        Ref: SecurityGroupId
      Container:
      - Name:
          Ref: ContainerName
        Image:
          Ref: ContainerImage
        Cpu: 2
        Memory: 4
        Port:
        - Port: 8080
          Protocol: TCP
        - Port: 8888
          Protocol: TCP
      ContainerGroupName:
        Ref: ContainerGroupName
      RestartPolicy:
        Ref: RestartPolicy
      SlsEnable:
        Ref: SlsEnable
      Cpu: 2
      Memory: 4
Outputs:
  ContainerGroupId:
    Value:
      Fn::GetAtt:
      - ContainerGroup
      - ContainerGroupId
  ContainerGroupName:
    Value:
      Fn::GetAtt:
      - ContainerGroup
      - ContainerGroupName
